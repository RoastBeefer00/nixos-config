# Catppuccin Mocha lock screen over the desktop wallpaper.
background {
  path = ~/Pictures/clearnight.jpg
  blur_passes = 2
  brightness = 0.6
}

label {
  text = $TIME
  color = rgb(cdd6f4)
  font_size = 96
  font_family = FiraCode Nerd Font
  position = 0, 140
  halign = center
  valign = center
}

input-field {
  size = 320, 56
  rounding = 14
  outline_thickness = 3
  outer_color = rgb(cba6f7)
  inner_color = rgb(1e1e2e)
  font_color = rgb(cdd6f4)
  check_color = rgb(f9e2af)
  fail_color = rgb(f38ba8)
  placeholder_text = Password
  fade_on_empty = false
  position = 0, -40
  halign = center
  valign = center
}
