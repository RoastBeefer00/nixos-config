# Lock screen over the wallpaper, coloured by the current theme preset (j713/themes.nix).
source = ~/.local/state/theme/current/hyprlock.conf

background {
  path = $wallpaper
  blur_passes = 2
  brightness = 0.6
}

label {
  text = $TIME
  color = $text
  font_size = 96
  font_family = FiraCode Nerd Font
  position = 0, 140
  halign = center
  valign = center
}

input-field {
  size = 320, 56
  rounding = 14
  outline_thickness = 3
  outer_color = $accent
  inner_color = $base
  font_color = $text
  check_color = $check
  fail_color = $fail
  placeholder_text = Password
  fade_on_empty = false
  position = 0, -40
  halign = center
  valign = center
}
